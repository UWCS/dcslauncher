[package]
name = "dcslauncher"
version = "0.1.0"
description = "A GUI launcher for UWCS's dcspkg application"
edition = "2021"
rust-version = "1.100"
repository = "https://github.com/UWCS/dcslauncher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
lazy_static = "1.5"
anyhow = "1"
dcspkg = { git = "https://github.com/UWCS/dcspkg.git", branch = "main" }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
